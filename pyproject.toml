[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-first-autoresearch"
version = "0.1.0"
description = "Evidence-first research discovery and review pipelines"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pypdf>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
autoresearch = "autoresearch.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
